name: audioplayers_example

description: Demonstrates how to use the audioplayers plugin.
publish_to: none

resolution: workspace

dependencies:
  audioplayers:
    path: ../
  collection: ^1.16.0
  file_picker_ohos:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_file_picker.git
      path: ohos
      ref: 10.2.0-ohos-1.0.0-beta.1
  flutter:
    sdk: flutter
  http: ^1.0.0
  path_provider:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: provider-v2.1.5-ohos-1.0.0
  provider: ^6.0.5

dev_dependencies:
  # Integration tests for audioplayers_platform_interface are handled 
  # in this package to avoid maintaining multiple example apps:
  audioplayers_platform_interface:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_audioplayers.git
      path: packages/audioplayers_platform_interface
  flame_lint: ^1.4.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'
