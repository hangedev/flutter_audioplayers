name: audioplayers_example
description: Demonstrates how to use the audioplayers plugin.
publish_to: none

dependencies:
  audioplayers:
    path: ../
  collection: ^1.16.0
  file_picker: ^5.0.1
  flutter:
    sdk: flutter
  http: ^0.13.1
  path_provider:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      path: packages/path_provider/path_provider
  provider: ^6.0.5

dev_dependencies:
  # Integration tests for audioplayers_platform_interface are handled 
  # in this package to avoid maintaining multiple example apps:
  audioplayers_platform_interface:
    git: 
      url: https://gitee.com/openharmony-sig/flutter_audioplayers.git
      path: packages/audioplayers_platform_interface
  flame_lint: ^0.2.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/

environment:
  sdk: ">=2.18.0 <3.0.0"
  flutter: ">=3.3.0"
